<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert Ecosystem Interactive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leader-line/1.0.7/leader-line.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🌵 ระบบนิเวศทะเลทราย (Desert Ecosystem) 🦂</h1>
    <div id="controls">
        <p>สถานะปัจจุบัน: <span id="status-text" style="color:#ffeb3b">ซ่อนสายใยอาหาร</span></p>
        <button id="toggle-btn">🔄 เปลี่ยนมุมมองสายใยอาหาร/ห่วงโซ่</button>
    </div>

    <div id="layout-container">
        
        <div id="desert-map">
            <div id="info-card">
                <h2 id="card-name">Name</h2>
                <span id="card-type" class="tag">Type</span>
                <p style="margin: 5px 0;"><strong>บทบาท:</strong> <span id="card-role">Role</span></p>
                <p id="card-desc" style="font-size: 0.8rem; color: #bac2de; margin: 0;">Description</p>
            </div>
            
        </div>
    </div>
    <div id="credits">
        <p>จัดทำโดย <strong class="text-green">กลุ่ม 5</strong> | ปีการศึกษา 2568</p>
        <p>เสนอ <strong class="text-yellow">ครูนฤมล คุ้มเนตร</strong> | วิชาวิทยาศาสตร์</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
